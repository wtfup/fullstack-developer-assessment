<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class Booking Ops</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Class Booking Ops</h1>
    <p class="tagline">Synthetic lab data — every member, class and booking here is fake.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="classes-heading">
      <div class="panel-head">
        <h2 id="classes-heading">Classes</h2>
        <div class="controls">
          <label for="day-filter">Day</label>
          <select id="day-filter">
            <option value="">All days</option>
            <option value="2026-08-11">Tue 11 Aug 2026 (IST)</option>
            <option value="2026-08-12">Wed 12 Aug 2026 (IST)</option>
            <option value="2026-08-13">Thu 13 Aug 2026 (IST)</option>
            <option value="2026-08-14">Fri 14 Aug 2026 (IST)</option>
            <option value="2026-08-15">Sat 15 Aug 2026 (IST)</option>
          </select>
          <button id="load-more" type="button">Load more</button>
        </div>
      </div>

      <table id="class-list">
        <thead>
          <tr>
            <th scope="col">Class</th>
            <th scope="col">Starts (IST)</th>
            <th scope="col">Coach</th>
            <th scope="col">Seats</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="classes-status" class="status" aria-live="polite"></p>
    </section>

    <aside class="sidebar">
      <section class="panel" aria-labelledby="popular-heading">
        <h2 id="popular-heading">Popular classes</h2>
        <ol id="popular-list" class="popular"></ol>
      </section>

      <section class="panel" aria-labelledby="booking-heading">
        <h2 id="booking-heading">Book a class</h2>
        <form id="booking-form">
          <label for="booking-class">Class</label>
          <select id="booking-class" required></select>
          <label for="booking-member">Member</label>
          <select id="booking-member" required></select>
          <button id="booking-submit" type="submit">Book seat</button>
        </form>
        <p id="booking-status" class="status" aria-live="polite"></p>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
